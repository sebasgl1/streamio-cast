name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Pruebas unitarias
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Streamio-Cast.apk


      # Cada push a main publica un release con el APK adjunto.
      # Enlace siempre vigente: /releases/latest/download/Streamio-Cast.apk
      - name: Publicar release con el APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" Streamio-Cast.apk \
            --title "Streamio Cast $TAG" \
            --notes "APK de depuración compilado desde $(git rev-parse --short HEAD)." \
            --latest
